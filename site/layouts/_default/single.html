{{ define "main" }}
<article class="post">
  <header>
    <p class="when"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time> · {{ .ReadingTime }} min read</p>
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="role">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
  <p><a href="/blog/">← all posts</a></p>
</article>
{{ end }}
