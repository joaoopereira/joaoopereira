<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">

    <nav aria-label="Main">

      <a href="/#projects">projects</a>

    <p>© {{ now.Year }} {{ site.Params.shortName }} · <a href="https://github.com/joaoopereira/joaoopereira">source</a></p>

</html>
